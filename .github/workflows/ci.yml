#
# tools/ci.sh's steps on Debian trixie: the header and format check; release
# builds and the installed headers' consumer on x86-64 and arm64; clang with
# its thread-safety analysis; clang-tidy; ASan and UBSan on both, TSan; the
# fuzz targets; coverage to Codecov; the Debian packages on both, linted; and
# a build and test on macOS. Every network request the tests make goes to a
# local server.
name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore: ["TODO/**", "docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["TODO/**", "docs/**", "**/*.md"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: ${{ matrix.step }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { step: check, arch: x86-64, runner: ubuntu-24.04 }
          - { step: release, arch: x86-64, runner: ubuntu-24.04 }
          - { step: release, arch: arm64, runner: ubuntu-24.04-arm }
          - { step: clang, arch: x86-64, runner: ubuntu-24.04 }
          - { step: tidy, arch: x86-64, runner: ubuntu-24.04 }
          - { step: asan, arch: x86-64, runner: ubuntu-24.04 }
          - { step: asan, arch: arm64, runner: ubuntu-24.04-arm }
          - { step: tsan, arch: x86-64, runner: ubuntu-24.04 }
          - { step: fuzz, arch: x86-64, runner: ubuntu-24.04 }
          - { step: package, arch: x86-64, runner: ubuntu-24.04 }
          - { step: package, arch: arm64, runner: ubuntu-24.04-arm }
    container:
      image: debian:trixie
      # LeakSanitizer needs ptrace to stop the process's threads.
      options: --cap-add SYS_PTRACE --security-opt seccomp=unconfined
    steps:
      - name: Install packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            g++ clang clang-format clang-tidy libclang-rt-19-dev cmake ninja-build git ca-certificates \
            libgtest-dev libyaml-cpp-dev libcurl4-openssl-dev libssl-dev

      - uses: actions/checkout@v7

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: ${{ matrix.step }}
        run: tools/ci.sh ${{ matrix.step }}

  # The Debian packages, on both architectures: the tests run inside the build,
  # and lintian fails them on any error or warning.
  deb:
    name: deb (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86-64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    container:
      image: debian:trixie
    steps:
      - name: Install packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends dpkg-dev debhelper git ca-certificates lintian

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # tags, for the package's version

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install build dependencies
        run: apt-get build-dep -y ./

      - name: Build
        run: tools/build-deb.sh

      - name: Lint
        run: lintian --fail-on error,warning build-deb/*.changes

      - uses: actions/upload-artifact@v7
        with:
          name: deb-${{ matrix.arch }}
          path: build-deb/*.deb

  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: debian:trixie
    steps:
      - name: Install packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            g++ cmake ninja-build git ca-certificates libgtest-dev libyaml-cpp-dev libcurl4-openssl-dev libssl-dev lcov \
            curl gnupg  # Codecov's uploader verifies its own signature

      - uses: actions/checkout@v7

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build and test
        run: tools/ci.sh coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: build-ci/coverage.info
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  macos:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Install packages
        run: brew install yaml-cpp googletest openssl@3

      - uses: actions/checkout@v7

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMANANNAN_BUILD_TESTING=ON -DMANANNAN_WARNINGS_AS_ERRORS=ON \
            -DCMAKE_PREFIX_PATH="$(brew --prefix)" -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
          cmake --build build -j "$(sysctl -n hw.ncpu)"

      - name: Test
        run: build/manannan_tests
