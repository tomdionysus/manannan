# Coverage is reported, not enforced: the standard is about 100%, and gaps are
# a backlog in TODO/ACTIVE.md.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

ignore:
  - "manannan/test/**"
  - "manannan/fuzz/**"
  - "tools/**"
